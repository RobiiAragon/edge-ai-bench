[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "edge-ai-bench"
version = "0.1.0"
description = "Benchmark the same small ONNX models across CPU, CoreML, Qualcomm QNN and CUDA, with INT8 QDQ quantization and multi-device HTML reports."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jesús Aragón" }]
requires-python = ">=3.11"
keywords = ["onnx", "onnxruntime", "benchmark", "quantization", "qualcomm", "snapdragon", "coreml", "edge-ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# onnxruntime is intentionally NOT a hard dependency: pick the wheel that matches
# your hardware (onnxruntime, onnxruntime-qnn, onnxruntime-gpu) or the Termux package.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.18"]
qnn = ["onnxruntime-qnn>=1.18"]
gpu = ["onnxruntime-gpu>=1.18"]
quant = ["onnx>=1.15"]
train = ["torch>=2.2", "torchvision>=0.17", "onnx>=1.15", "onnxscript>=0.1", "scikit-learn>=1.3"]
aihub = ["qai-hub>=0.30"]
mem = ["psutil>=5.9"]
dev = ["onnxruntime>=1.18", "onnx>=1.15", "psutil>=5.9", "pytest>=8", "ruff>=0.5"]

[project.scripts]
edge-ai-bench = "edge_ai_bench.cli:main"

[project.urls]
Homepage = "https://github.com/RobiiAragon/edge-ai-bench"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_ai_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
